<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>HD Icons</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <h1 class="logo">
        <span class="logo-icon">🎨</span>
        <span>HD Icons</span>
        <span class="badge" id="totalBadge">0</span>
      </h1>
      <div class="header-actions">
        <button class="btn btn-sm btn-auth" id="loginBtn" title="登录" style="display:none">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          登录
        </button>
        <div class="auth-user" id="authUser" style="display:none">
          <div class="auth-user-menu">
            <button class="btn btn-sm btn-auth auth-user-trigger" id="authUserBtn" title="账户菜单">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span class="auth-user-name" id="authUserName"></span>
              <svg class="auth-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="auth-dropdown" id="authDropdown">
              <button type="button" class="auth-dropdown-item" id="changePasswordBtn">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                修改密码
              </button>
              <button type="button" class="auth-dropdown-item auth-dropdown-danger" id="logoutBtn">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                退出登录
              </button>
            </div>
          </div>
        </div>
        <button class="btn btn-icon" id="selectBtn" title="批量选择">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </button>
        <button class="btn btn-icon" id="uploadBtn" title="上传图标">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button class="btn btn-icon" id="themeBtn" title="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Search & Filters -->
  <div class="toolbar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="搜索图标名称..." autocomplete="off" />
      <span class="search-count" id="searchCount"></span>
    </div>
    <div class="filter-row">
      <div class="filter-tabs" id="filterTabs">
        <button class="tab active" data-type="all">全部</button>
      </div>
      <button class="btn btn-icon tab-add" id="addCategoryBtn" title="创建分类">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>

  <!-- Icons Grid -->
  <main class="grid-container">
    <div class="grid" id="iconsGrid"></div>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>加载中...</p>
    </div>
    <div class="empty" id="empty" style="display:none">
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 15h8"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/></svg>
      <p>没有找到图标</p>
      <p class="empty-hint" id="emptyHint">暂无图标数据</p>
    </div>
  </main>

  <!-- Upload Modal -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal">
      <div class="modal-header">
        <h2>上传图标</h2>
        <button class="btn btn-icon modal-close" id="uploadModalClose">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="form-group upload-category-select">
        <label for="uploadCategory">上传到分类</label>
        <select id="uploadCategory"></select>
      </div>
      <div class="upload-zone" id="uploadZone">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p>拖拽文件到此处，或点击选择</p>
        <p class="upload-hint">支持 png, jpg, gif, svg, ico, webp 等格式</p>
        <p class="upload-hint upload-auth-hint">🔒 需要登录后使用</p>
        <input type="file" id="fileInput" multiple accept="image/*" style="display:none" />
      </div>
      <div class="upload-progress" id="uploadProgress" style="display:none">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <p id="uploadStatus">上传中...</p>
      </div>
    </div>
  </div>

  <!-- Setup Modal -->
  <div class="modal-overlay" id="setupModal">
    <div class="modal modal-setup">
      <div class="modal-header">
        <h2>设置管理员账号</h2>
        <button class="btn btn-icon modal-close" id="setupModalClose">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="setup-welcome">
        <div class="setup-icon">🔐</div>
        <p class="setup-lead">首次访问，你可以设置管理员账号来保护上传和删除功能。</p>
        <p class="setup-hint">也可以稍后再设置 — 关闭此窗口后，上传和删除对所有人开放。</p>
      </div>
      <form id="setupForm" class="auth-form">
        <div class="form-group">
          <label for="setupUsername">用户名</label>
          <input type="text" id="setupUsername" required autocomplete="username" placeholder="设置登录用户名" />
        </div>
        <div class="form-group">
          <label for="setupPassword">密码</label>
          <input type="password" id="setupPassword" required autocomplete="new-password" placeholder="至少 6 个字符" />
        </div>
        <div class="form-group">
          <label for="setupPasswordConfirm">确认密码</label>
          <input type="password" id="setupPasswordConfirm" required autocomplete="new-password" placeholder="再次输入密码" />
        </div>
        <p class="form-error" id="setupError" style="display:none"></p>
        <button type="submit" class="btn btn-primary btn-block">创建账号</button>
        <button type="button" class="btn btn-block btn-ghost" id="setupSkipBtn">暂不设置</button>
      </form>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <div class="modal-header">
        <h2>登录</h2>
        <button class="btn btn-icon modal-close" id="loginModalClose">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginUsername">用户名</label>
          <input type="text" id="loginUsername" required autocomplete="username" placeholder="输入用户名" />
        </div>
        <div class="form-group">
          <label for="loginPassword">密码</label>
          <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="输入密码" />
        </div>
        <p class="form-error" id="loginError" style="display:none"></p>
        <button type="submit" class="btn btn-primary btn-block">登录</button>
      </form>
    </div>
  </div>

  <!-- Change Password Modal -->
  <div class="modal-overlay" id="changePasswordModal">
    <div class="modal">
      <div class="modal-header">
        <h2>修改密码</h2>
        <button class="btn btn-icon modal-close" id="changePasswordModalClose">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="changePasswordForm" class="auth-form">
        <div class="form-group">
          <label for="currentPassword">当前密码</label>
          <input type="password" id="currentPassword" required autocomplete="current-password" placeholder="输入当前密码" />
        </div>
        <div class="form-group">
          <label for="newPassword">新密码</label>
          <input type="password" id="newPassword" required autocomplete="new-password" placeholder="至少 6 个字符" />
        </div>
        <div class="form-group">
          <label for="newPasswordConfirm">确认新密码</label>
          <input type="password" id="newPasswordConfirm" required autocomplete="new-password" placeholder="再次输入新密码" />
        </div>
        <p class="form-error" id="changePasswordError" style="display:none"></p>
        <button type="submit" class="btn btn-primary btn-block">保存新密码</button>
      </form>
    </div>
  </div>

  <!-- Category Modal -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal">
      <div class="modal-header">
        <h2>创建分类</h2>
        <button class="btn btn-icon modal-close" id="categoryModalClose">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="categoryForm" class="login-form">
        <div class="form-group">
          <label>分类名称</label>
          <input type="text" id="categoryName" required placeholder="输入分类名称" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">创建</button>
      </form>
    </div>
  </div>

  <!-- Rename Category Modal -->
  <div class="modal-overlay" id="renameCategoryModal">
    <div class="modal">
      <div class="modal-header">
        <h2>重命名分类</h2>
        <button class="btn btn-icon modal-close" id="renameCategoryModalClose">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="renameCategoryForm" class="login-form">
        <div class="form-group">
          <label for="renameCategoryInput">新名称</label>
          <input type="text" id="renameCategoryInput" required placeholder="输入新名称" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">确认重命名</button>
      </form>
    </div>
  </div>

  <!-- Rename Modal -->
  <div class="modal-overlay" id="renameModal">
    <div class="modal">
      <div class="modal-header">
        <h2>重命名图标</h2>
        <button class="btn btn-icon modal-close" id="renameModalClose">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="renameForm" class="auth-form">
        <div class="form-group">
          <label for="renameInput">新文件名</label>
          <input type="text" id="renameInput" required placeholder="输入新文件名" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">确认重命名</button>
      </form>
    </div>
  </div>

  <!-- Move Modal -->
  <div class="modal-overlay" id="moveModal">
    <div class="modal">
      <div class="modal-header">
        <h2>移动到分类</h2>
        <button class="btn btn-icon modal-close" id="moveModalClose">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="moveForm" class="auth-form">
        <div class="form-group">
          <label for="moveCategory">目标分类</label>
          <select id="moveCategory"></select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">确认移动</button>
      </form>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal modal-preview">
      <button class="btn btn-icon modal-close" id="previewModalClose">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <img id="previewImage" src="" alt="" />
      <div class="preview-info">
        <span id="previewName"></span>
        <button class="btn btn-sm" id="previewCopy">复制地址</button>
      </div>
    </div>
  </div>

  <!-- Batch Action Bar -->
  <div class="batch-bar" id="batchBar" style="display:none">
    <span class="batch-count" id="batchCount">已选 0 个图标</span>
    <div class="batch-actions">
      <button class="btn btn-sm" id="batchMoveBtn">移动到...</button>
      <button class="btn btn-sm btn-danger" id="batchDeleteBtn">删除</button>
      <button class="btn btn-sm" id="batchCancelBtn">取消</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Back to top -->
  <button class="btn btn-icon btn-float" id="backToTop" title="回到顶部" style="display:none">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <footer class="footer">
    <p>
      数据来源：<a href="https://github.com/xushier/HD-Icons" target="_blank">xushier/HD-Icons</a>
      &nbsp;·&nbsp;
      部署于 <a href="https://www.cloudflare.com/" target="_blank">Cloudflare</a>
    </p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
